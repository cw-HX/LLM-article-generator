<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./static/css/style.css">
    <title>AI Content Generator</title>
</head>
<body>
    <main>
        <div class="app-card">
            <header class="header">
                <h1 class="title">LLM Article Generator</h1>
                <p class="subtitle">Let AI Generate an Optimized Article</p>
            </header>

            <section class="form-section">
                <label for="promptInput">Your Article Title</label>
                <p class="helper">Enter a Title Below</p>

                <input id="promptInput" class="input-field" type="text" placeholder="e.g. how to get guest writers blog" />

                <div class="cta-wrap">
                    <button id="submitBtn" class="cta-button">Start Generating</button>
                </div>
            </section>

            <section id="resultSection">
                <div id="spinner" class="hidden">Generating…</div>
                <div id="content" class="hidden"></div>
                <div class="cta-wrap" style="margin-top:18px;text-align:center;">
                    <button id="anotherBtn" class="secondary-button hidden">Generate Another</button>
                </div>
            </section>
        </div>
    </main>

    <script>
        const submitBtn = document.getElementById('submitBtn');
        const promptInput = document.getElementById('promptInput');
        const contentEl = document.getElementById('content');
        const spinner = document.getElementById('spinner');
        const anotherBtn = document.getElementById('anotherBtn');

        async function generate() {
            const prompt = promptInput.value.trim();
            if (!prompt) {
                contentEl.innerHTML = '<p style="color:#dc2626">Please enter a title.</p>';
                return;
            }
            spinner.classList.remove('hidden');
            submitBtn.disabled = true;
            try {
                const res = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                if (!res.ok) {
                    const text = await res.text();
                    contentEl.innerHTML = `<p style="color:#dc2626">Error: ${res.status} ${text}</p>`;
                    // show content area so the user sees the error
                    contentEl.classList.remove('hidden');
                    if (anotherBtn) anotherBtn.classList.add('hidden');
                } else {
                    const html = await res.text();
                    contentEl.innerHTML = html;
                    // reveal generated content and the "Generate Another" button
                    contentEl.classList.remove('hidden');
                    if (anotherBtn) {
                        anotherBtn.classList.remove('hidden');
                        anotherBtn.onclick = () => { window.location.href = '/'; };
                    }
                }
            } catch (err) {
                contentEl.innerHTML = `<p style="color:#dc2626">Request failed.</p>`;
                contentEl.classList.remove('hidden');
            } finally {
                spinner.classList.add('hidden');
                submitBtn.disabled = false;
            }
        }

        submitBtn.addEventListener('click', generate);

        // Allow Ctrl+Enter (or Cmd+Enter) to submit
        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                generate();
            }
        });
    </script>

</body>
</html>
